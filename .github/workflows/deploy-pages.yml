name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Serve from /<repo-name>/ on project Pages.
      - name: Set base path
        run: echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"

      # Optional: point the Pages build at a deployed backend (Supabase Edge
      # Function or Node server). Set the repository variable VITE_API_BASE
      # (Settings → Secrets and variables → Actions → Variables), e.g.
      #   https://<project-ref>.supabase.co/functions/v1
      # When unset the app runs in local single-browser mode as before.
      - name: Point the build at the backend (optional)
        if: ${{ vars.VITE_API_BASE != '' }}
        run: echo "VITE_API_BASE=${{ vars.VITE_API_BASE }}" >> "$GITHUB_ENV"

      - run: npm run build

      # enablement:true turns Pages on for the repo automatically (no manual step).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
